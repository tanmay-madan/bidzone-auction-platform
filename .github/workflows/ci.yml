name: BidZone Automated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Database Integrity, Concurrency & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidzone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Initialize PostgreSQL Database Schema & Seed
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d bidzone -f database/schema.sql
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d bidzone -f database/seed.sql

      - name: Run Database Invariant Consistency Check
        run: |
          cd backend
          node scripts/consistency-check.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: bidzone

      - name: Execute Live Concurrency, IDOR Security & Settlement Test Suites
        run: |
          cd backend
          # Start backend server in background
          PORT=5000 DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=bidzone JWT_SECRET=ci_test_secret_123 node src/server.js &
          SERVER_PID=$!
          sleep 3

          echo ">>> 1. Running 5-Scenario Concurrency Harness..."
          node scripts/concurrency-test.js

          echo ">>> 2. Running Security & IDOR Authorization Suite..."
          node scripts/security-idor-test.js

          echo ">>> 3. Running Settlement Advisory Locks & Anti-Sniping Suite..."
          node scripts/settlement-and-sniping-test.js

          kill $SERVER_PID
        env:
          API_URL: http://localhost:5000/api
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: bidzone

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
