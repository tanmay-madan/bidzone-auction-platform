<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="BidZone | Live Auctions, Real-Time Bidding" />
    <meta property="og:description" content="Bid live, get outbid alerts instantly and win with confidence." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080A0F" />
    <script>
      // Apply the saved/OS theme before first paint (avoids a flash).
      try {
        var t = localStorage.getItem("bidzone_theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    </script>
    <meta name="description" content="BidZone is a real-time, concurrency-safe auction marketplace. Bid live, get outbid alerts instantly and win with confidence." />
    <title>BidZone | Live Auctions, Real-Time Bidding</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
